version: "3.7"
services:
  bootstrap-node:
    image: kadlab:latest
    stdin_open: true
    tty: true
    networks:
      - kademlia_network
    ports:
      - "8081:8081" 
    environment:
      - REST_PORT=8081
      - ALPHA=${ALPHA}
      - BETA=${BETA}
      - K=${K}
      - TTL=${TTL}
    hostname: bootstrap-node
  joining-nodes:
    image: kadlab:latest
    stdin_open: true
    tty: true
    deploy:
      mode: replicated
      replicas: 49
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 10s
    networks:
      - kademlia_network
    ports:
      - "8100-8148:8080"
    environment:
      - REST_PORT=8080
      - BOOTSTRAP_ADDRESS=bootstrap-node:8000
      - ALPHA=${ALPHA}
      - BETA=${BETA}
      - K=${K}
      - TTL=${TTL}
    depends_on:
      - bootstrap-node

networks:
  kademlia_network:

# To deploy the stack, use the command:
# docker stack deploy -c docker-compose.yml kadlab